{% extends "base.html" %}

{% block title %}Joe的个人小站 | 档案馆{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static',filename = 'css/html-style/oc_introduce.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static',filename = 'css/animations/animation-oc_introduce.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static',filename = 'css/mobile-adaption.css' ) }}">
{% endblock %}

{% block head_js %}
    <script src="{{ url_for('static', filename='js/oc_introduce.js')}}"></script>
{% endblock %}

{% block page_title %}档案馆{% endblock %}

{% block content %}
    <div class="CenterContainer">
        <div class="page-header">
        </div>
        <div id="oc_introduce_panel" class="glass-effect cyber-frame">
            <button id="sidebar-toggle" class="cyber-control" type="button" aria-label="切换侧边栏" aria-controls="sidebar" aria-expanded="false">☰</button>
            <div id="sidebar" class="cyber-frame">
                <ul id="title-list">
                    {% for title in titleList %}
                    <li><button type="button" class="TextTitle cyber-control" data-title="{{loop.index}} {{title}}">{{title}}</button></li>
                    {% endfor %}
                </ul>
            </div>
            <div id="content-container" class="cyber-frame">
                <div id="output"></div>
            </div>
        </div>
    </div>
{% endblock %}
