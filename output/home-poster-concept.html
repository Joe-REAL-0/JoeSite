<div id="joe-poster-concept" aria-label="Joe 首页海报式布局方案">
  <style>
    #joe-poster-concept { --joe-bg:light-dark(#e4edec,#061016); --joe-ink:light-dark(#132a31,#effbfa); --joe-muted:light-dark(#48616a,#9bb6bd); --joe-blue:light-dark(#1268a5,#71c6ff); --joe-rule:light-dark(#a3bac1,#29444f); container-type:inline-size; color:var(--joe-ink); font-family:system-ui,sans-serif; }
    #joe-poster-concept * {box-sizing:border-box}
    #joe-poster-concept .poster {position:relative; width:100%; aspect-ratio:16/9; background:var(--joe-bg); overflow:hidden}
    #joe-poster-concept .art {position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; pointer-events:none}
    #joe-poster-concept .directory {position:absolute; top:6%; right:5%; width:16%; display:flex; flex-direction:column; gap:clamp(6px,1.1cqw,12px)}
    #joe-poster-concept .eyebrow {font-size:11px; font-weight:500; letter-spacing:.18em; color:var(--joe-muted)}
    #joe-poster-concept .nav-row {display:flex; justify-content:space-between; align-items:center; font-size:14px; letter-spacing:.12em; gap:8px; white-space:nowrap}
    #joe-poster-concept .nav-row span:last-child {color:var(--joe-blue)}
    #joe-poster-concept .account {font-size:12px; color:var(--joe-muted); padding-top:8px; border-top:1px solid var(--joe-rule)}
    #joe-poster-concept .greeting {position:absolute; left:57%; top:64%; right:5%; }
    #joe-poster-concept .intro {font-size:14px; letter-spacing:.12em; margin:0 0 8px; color:var(--joe-muted)}
    #joe-poster-concept h1 {font-size:clamp(28px,6cqw,68px); line-height:1.1; font-weight:500; letter-spacing:.08em; margin:0; white-space:nowrap}
    #joe-poster-concept .byline {display:flex; align-items:center; gap:12px; margin-top:18px; font-size:11px; letter-spacing:.18em; color:var(--joe-muted)}
    #joe-poster-concept .byline::before {content:''; width:32px; height:2px; background:var(--joe-blue)}
    #joe-poster-concept .socials {position:absolute; left:57%; right:5%; bottom:5%; display:flex; flex-wrap:wrap; gap:12px 18px; color:var(--joe-muted); font-size:12px}
    #joe-poster-concept .mobile-menu {display:none; position:absolute; right:5%; top:5%; border:0; padding:10px; background:var(--joe-bg); color:var(--joe-ink); font:inherit}
    #joe-poster-concept .drawer {position:absolute; inset:0; background:var(--joe-bg); padding:30px; z-index:2}
    #joe-poster-concept .drawer[hidden] {display:none}
    #joe-poster-concept .drawer button {float:right; padding:10px; border:1px solid var(--joe-rule); color:var(--joe-ink); background:var(--joe-bg)}
    #joe-poster-concept .drawer p {margin:24px 0; font-size:18px}
    @container (max-width: 650px) {
      #joe-poster-concept .poster {aspect-ratio:3/4}
      #joe-poster-concept .directory {display:none}
      #joe-poster-concept .mobile-menu {display:block}
      #joe-poster-concept .greeting {left:55%; right:4%; top:63%}
      #joe-poster-concept .intro {font-size:12px; letter-spacing:0}
      #joe-poster-concept h1 {font-size:clamp(25px,7cqw,44px); letter-spacing:0}
      #joe-poster-concept .byline {font-size:11px; letter-spacing:0; gap:6px; margin-top:12px}
      #joe-poster-concept .byline::before {width:12px}
      #joe-poster-concept .socials {left:55%; right:4%; bottom:4%; gap:8px 12px; font-size:11px}
    }
  </style>

  <script>
    (() => {
      const root = document.getElementById('joe-poster-concept');
      const menu = root.querySelector('.mobile-menu');
      const drawer = root.querySelector('.drawer');
      const close = root.querySelector('.close-menu');
      function setOpen(open) { drawer.hidden = !open; menu.setAttribute('aria-expanded', String(open)); (open ? close : menu).focus(); }
      menu.addEventListener('click', () => setOpen(true));
      close.addEventListener('click', () => setOpen(false));
      root.addEventListener('keydown', event => {if(event.key === 'Escape' && !drawer.hidden) setOpen(false);});
      const state = { spacing:0.08 };
      const heading = root.querySelector('h1');
      if (globalThis.Tweak) {
        const tweak = new Tweak({container:root, onChange:() => {heading.style.letterSpacing = state.spacing + 'em';}});
        tweak.addSlider(state,'spacing',{label:'标题字距',min:0,max:0.12,step:0.01,unit:'em'});
      }
    })();
  </script>
